# No-new-service Free-tier topology. The API and a supervised RQ worker
# child share the existing Free Render web service. Queue + run state use the
# already-existing Upstash Redis database over native TLS Redis TCP.
# No new Render worker, Key Value, or PostgreSQL resource is provisioned.
services:
  - type: web
    name: ai-automation-api
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    dockerCommand: 'uvicorn app.api.main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: APP_ENV
        value: production
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional QStash Workflow background execution; credentials are added
      # privately to the existing ai-automation-api Render service.
      - key: QSTASH_WORKFLOW_ENABLED
        value: "false"
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: QSTASH_URL
        sync: false
      - key: UPSTASH_WORKFLOW_URL
        sync: false
      - key: FLOWPILOT_GATEWAY_CREDENTIAL_KEY
        sync: false
      # Optional existing PostgreSQL connection. Leave blank to use Redis state.
      - key: DATABASE_URL
        sync: false
      # Existing Upstash Redis TCP URL (rediss://default:<password>@<host>:6379/0).
      # Do not use the Upstash REST URL here; RQ requires native Redis commands.
      - key: REDIS_URL
        sync: false
      - key: REDIS_STATE_ENABLED
        value: "true"
      - key: REDIS_KEY_PREFIX
        value: aiac-flowpilot
      - key: QUEUE_NAME
        value: aiac-flowpilot
      - key: EMBEDDED_RQ_WORKER_ENABLED
        value: "true"
      - key: WORKFLOW_JOB_TIMEOUT_SECONDS
        value: "600"
      - key: APP_VERSION
        value: 3.5.0
      - key: DEMO_MODE
        value: "false"
      - key: INLINE_EXECUTION
        value: "false"
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: API_AUTH_ENABLED
        value: "true"
      - key: API_AUTH_REQUIRE_KEYS
        value: "true"
      - key: API_OPERATOR_KEYS
        generateValue: true
      - key: API_REVIEWER_KEYS
        generateValue: true
      - key: API_ADMIN_KEYS
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_GATEWAY_URL
        sync: false
      - key: LLM_GATEWAY_ALLOWED_HOSTS
        value: portfolio-llm-gateway.onrender.com
      - key: REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: MAX_RETRIES
        value: "1"
      - key: SCHEDULE_ENABLED
        value: "false"
      - key: EVALUATION_HARNESS_URL
        value: https://ai-engineering-evaluation-harness.onrender.com
      - key: EVALUATION_HARNESS_INGEST_TOKEN
        sync: false
      - key: OTEL_ENABLED
        value: "false"
