# Portfolio/demo topology. Workflows run as in-process background tasks and
# use ephemeral run state; HTTP requests return the run reference immediately.
# See render.production.yaml for the durable PostgreSQL + Redis worker topology.
services:
  - type: web
    name: ai-automation-api
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    dockerCommand: 'uvicorn app.api.main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: APP_ENV
        value: production
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: APP_VERSION
        value: 3.5.0
      - key: DEMO_MODE
        value: "false"
      - key: INLINE_EXECUTION
        value: "true"
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: API_AUTH_ENABLED
        value: "true"
      - key: API_AUTH_REQUIRE_KEYS
        value: "true"
      - key: API_OPERATOR_KEYS
        generateValue: true
      - key: API_REVIEWER_KEYS
        generateValue: true
      - key: API_ADMIN_KEYS
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_GATEWAY_URL
        sync: false
      - key: REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: MAX_RETRIES
        value: "1"
      - key: SCHEDULE_ENABLED
        value: "false"
      - key: OTEL_ENABLED
        value: "false"

  - type: web
    name: ai-automation-ui
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /_stcore/health
    dockerCommand: 'streamlit run ui/app.py --server.address=0.0.0.0 --server.port $PORT --server.headless=true'
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: ai-automation-api
          property: host
      - key: API_PORT
        fromService:
          type: web
          name: ai-automation-api
          property: port
      # Public UI receives operator permissions only. Reviewer/admin secrets
      # are intentionally not injected into a client-facing service.
      - key: API_OPERATOR_KEY
        fromService:
          type: web
          name: ai-automation-api
          envVarKey: API_OPERATOR_KEYS
      - key: RUN_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: PORTFOLIO_SESSION_GATEWAY_URL
        sync: false
