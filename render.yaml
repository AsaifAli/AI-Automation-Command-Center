services:
  - type: web
    name: ai-automation-api
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    dockerCommand: 'uvicorn app.api.main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: INLINE_EXECUTION
        value: "true"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: API_AUTH_ENABLED
        value: "true"
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: MAX_RETRIES
        value: "2"
      - key: SCHEDULE_ENABLED
        value: "false"
      - key: OTEL_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-automation-db
          property: connectionString

  - type: web
    name: ai-automation-ui
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /_stcore/health
    dockerCommand: 'streamlit run ui/app.py --server.address=0.0.0.0 --server.port $PORT --server.headless=true'
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: ai-automation-api
          property: host
      - key: API_PORT
        fromService:
          type: web
          name: ai-automation-api
          property: port
      - key: API_KEY
        fromService:
          type: web
          name: ai-automation-api
          envVarKey: API_KEY

databases:
  - name: ai-automation-db
    plan: free
    databaseName: automation
    user: automation
